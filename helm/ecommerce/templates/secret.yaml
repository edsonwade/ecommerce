{{/*
Secrets are managed externally via Vault or Sealed Secrets.
When global.externalSecrets.enabled is true, ExternalSecret resources pull from Vault
(requires External Secrets Operator CRDs: https://external-secrets.io/).
When false, plain Kubernetes Secrets are created with values from global.secrets
(suitable for Kind-based CI staging where no Vault backend exists).
*/}}
{{- range $name, $svc := .Values.services }}
---
{{- if $.Values.global.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    {{ include "ecommerce.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ $name }}-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/ecommerce/{{ $name }}
        property: postgres_password
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: secret/ecommerce/{{ $name }}
        property: mongo_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/ecommerce/shared
        property: jwt_secret
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: secret/ecommerce/shared
        property: kafka_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/ecommerce/shared
        property: redis_password
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: secret/ecommerce/shared
        property: vault_app_token
    - secretKey: EUREKA_PASSWORD
      remoteRef:
        key: secret/ecommerce/shared
        property: eureka_password
    # F7 — shared service-to-service secret sent as X-Internal-Token on the
    # /internal purchase-verification call (product-service → order-service).
    # order-service.yml / product-service.yml bind it with NO default, so it must
    # exist here or those two contexts fail to start on an unresolved placeholder.
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/ecommerce/shared
        property: internal_service_token
    # Rotation overlap value. Mapped PERMANENTLY, not added ad-hoc during a rotation: External
    # Secrets Operator fails to sync the whole Secret when a referenced property is missing, so a
    # key that appears and disappears would turn every rotation into a chart edit plus a window
    # where the Secret does not reconcile. The Vault property must therefore ALWAYS exist — set it
    # to an empty string when no rotation is in progress. A blank value is dropped by
    # InternalTokenAuthenticator, so it never becomes a valid empty secret.
    - secretKey: INTERNAL_SERVICE_TOKEN_PREVIOUS
      remoteRef:
        key: secret/ecommerce/shared
        property: internal_service_token_previous
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    {{ include "ecommerce.labels" $ | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $.Values.global.secrets.postgresPassword | default "changeme" | quote }}
  MONGO_PASSWORD: {{ $.Values.global.secrets.mongoPassword | default "changeme" | quote }}
  JWT_SECRET: {{ $.Values.global.secrets.jwtSecret | default "staging-jwt-secret-for-ci-testing-only-32b" | quote }}
  KAFKA_PASSWORD: {{ $.Values.global.secrets.kafkaPassword | default "changeme" | quote }}
  REDIS_PASSWORD: {{ $.Values.global.secrets.redisPassword | default "changeme" | quote }}
  VAULT_TOKEN: {{ $.Values.global.secrets.vaultToken | default "root-token" | quote }}
  EUREKA_PASSWORD: {{ $.Values.global.secrets.eurekaPassword | default "changeme" | quote }}
  INTERNAL_SERVICE_TOKEN: {{ $.Values.global.secrets.internalServiceToken | default "staging-internal-s2s-token-ci-only" | quote }}
  # Empty unless a rotation is in progress — see the ExternalSecret branch above.
  INTERNAL_SERVICE_TOKEN_PREVIOUS: {{ $.Values.global.secrets.internalServiceTokenPrevious | default "" | quote }}
{{- end }}
{{- end }}
